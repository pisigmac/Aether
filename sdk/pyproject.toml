[project]
name = "kaether"
version = "0.1.1"
description = "Python SDK for the Aether software physics engine"
requires-python = ">=3.10"
authors = [
    { name = "Vikas Budde", email = "vikas.budde@hotmail.com" },
]
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
]

[project.urls]
Homepage = "https://github.com/pisigmac/Aether"
Repository = "https://github.com/pisigmac/Aether"
Issues = "https://github.com/pisigmac/Aether/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["aether_sdk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
