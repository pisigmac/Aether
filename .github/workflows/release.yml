# Builds the IDE plugin on every push and pull request.
# Publishes kaether to PyPI when a GitHub Release is published.
#
# PyPI uses a trusted publisher. On https://pypi.org/manage/project/kaether/settings/publishing/
# add a GitHub publisher:
#   Owner: pisigmac
#   Repository: Aether
#   Workflow: release.yml
#   Environment: (leave empty)
# The version in sdk/pyproject.toml must be new. PyPI rejects a version that already exists.

name: Release

on:
  push:
    branches: [dev, main]
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test the SDK
        working-directory: sdk
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest -q

  vsix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Package the IDE plugin
        working-directory: ide/aether-livebar
        run: npx --yes @vscode/vsce package --allow-missing-repository
      - uses: actions/upload-artifact@v4
        with:
          name: aether-livebar-vsix
          path: ide/aether-livebar/*.vsix
          if-no-files-found: error
      - name: Attach the VSIX to the GitHub release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" ide/aether-livebar/*.vsix --clobber

  pypi:
    needs: sdk
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build kaether
        working-directory: sdk
        run: |
          python -m pip install build
          python -m build
      - name: Publish kaether to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdk/dist
